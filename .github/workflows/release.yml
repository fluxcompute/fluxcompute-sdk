name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Verify the tag matches the packaged version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import re,pathlib;\
          print(re.search(r'^version = \"([^\"]+)\"', \
          pathlib.Path('pyproject.toml').read_text(), re.M).group(1))")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match pyproject version $pkg"
            exit 1
          fi

      - name: Build sdist and wheel
        run: python -m build

      - name: Check that no private code is packaged
        # The public SDK must never ship the recovery add-on or the
        # server-side modules. Cheap to check, catastrophic to get wrong.
        run: |
          set -euo pipefail
          listing=$(python - <<'PY'
          import pathlib, tarfile, zipfile
          names = []
          for p in pathlib.Path("dist").iterdir():
              if p.suffix == ".whl":
                  names += zipfile.ZipFile(p).namelist()
              elif p.name.endswith(".tar.gz"):
                  names += tarfile.open(p).getnames()
          print("\n".join(names))
          PY
          )
          echo "$listing"
          if echo "$listing" | grep -Eq 'intelligence/|redis_session|(^|/)app/|dashboard-ui|alembic|deploy/'; then
            echo "::error::Private or server-side files found in the distribution"
            exit 1
          fi

      # The gitleaks CLI is MIT-licensed and free; only the gitleaks-action
      # wrapper requires a paid licence for organisation-owned repos, and it
      # fails closed without one — which blocked this release rather than
      # scanning it. Running the binary keeps the check real and unmetered.
      - name: Scan the tree for secrets
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          # `dir` scans the working tree that is about to be packaged, rather
          # than commit history — the right target here, and it exits non-zero
          # on any finding. Verified both ways before adopting: clean on this
          # tree, and it fails on planted GitHub/AWS/Slack credentials.
          ./gitleaks dir . --redact --verbose
          rm -f gitleaks gitleaks.tar.gz

      - name: twine check
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted Publishing (OIDC) — no API token is stored anywhere.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

# The closed vocabulary of facts the brain will hold, and who wins a disagreement.
#
# Why a closed vocabulary: without one, the same fact arrives as "price of the starter plan",
# "Starter tier cost" and "starter_monthly_usd" on three runs, and the reconciler sees three
# facts instead of one changing fact. The model must choose a key from this list; anything
# else is a schema failure, retried once, then recorded and skipped.
#
# Why precedence is data: it is the only place a human decides which source is authoritative
# for which subject. It is not in a prompt, so no email can argue its way into winning.

version: "2026-09-07.1"

# Files that are collected but never extracted from.
#
# A changelog records what used to be true. Extracting from it produces facts that outlive
# their own removal: the 2.4.0 section still says "integrated with Kestrel" long after 2.5.0
# removed it, and since that section never changes, nothing would ever retract the fact.
# The rule is general: a brain states what is true now, so its sources must be documents that
# describe the present.
exclude:
  - "CHANGELOG.md"
  - ".env.example"
  - "*.png"
  - "*.jpg"
  - "*.pem"

# Sources, most authoritative last in each precedence list.
sources:
  repo: "The company's own repository. Authoritative for how the product works."
  brand: "brand.md. Authoritative for voice, naming and positioning."
  email: "Announcements from allowlisted senders. Fastest, least reviewed."

# Only these senders can produce facts. Everything else is collected and ignored.
# An inbound email is untrusted text: an allowlist in code is what stops a stranger
# rewriting the company's own description of itself.
email_allowlist:
  - priya@northwind.example.com
  - hr@northwind.example.com
  - ops@northwind.example.com

# Precedence per attribute namespace. First match wins; later entries beat earlier ones.
precedence:
  "pricing.*": [repo, brand, email]      # a price change is announced by email before the repo catches up
  "company.tagline": [repo, email, brand]   # marketing changes brand.md before the README
  "company.brand_colour": [repo, email, brand]
  "brand.*": [repo, email, brand]        # brand.md is the last word on voice
  "*": [email, brand, repo]              # otherwise the repository is authoritative

entities:
  company:
    attributes:
      name: "Registered or trading name."
      tagline: "The one-line description used in marketing."
      description: "What the product does, in one or two sentences."
      licence: "The licence the product ships under."
      install_command: "How a developer installs it."
      brand_colour: "The primary brand colour, with a hex value."
      office: {desc: "A physical office location, with the city.", multi: true}
  pricing:
    attributes:
      starter_monthly_usd: "Starter plan price per month, in US dollars."
      growth_monthly_usd: "Growth plan price per month, in US dollars."
      enterprise_terms: "How the Enterprise plan is priced."
      overage_per_load_usd: "Overage price per planned load."
  product:
    attributes:
      integration: {desc: "A named third-party system the product integrates with.", multi: true}
      capability: {desc: "Something the product can do.", multi: true}
      sdk_version: "The version of a dependency the product pins."
      runtime: "Language or platform the service runs on."
      latency_p95_ms: "Stated p95 latency for the planning path."
      capacity_refresh: "How often carrier capacity is refreshed."
  security:
    attributes:
      certification: {desc: "A named compliance certification.", multi: true}
      data_retention_days: "How long customer data is kept, in days."
      encryption: "How data at rest is encrypted."
  team:
    attributes:
      ceo: "Name of the Chief Executive Officer."
      cto: "Name of the Chief Technology Officer."
      head_of_customer_success: "Name of the Head of Customer Success."
      staff_engineer: {desc: "Name of a staff engineer and their area.", multi: true}
      sre: "Name of a site reliability engineer."
  roadmap:
    attributes:
      planned: {desc: "Something the company has said it plans to build.", multi: true}

# A source that stops asserting a fact does not immediately delete it: a failed fetch and a
# real deletion look identical for one run. Two consecutive absences make it a removal.
removal:
  # Two different disappearances, two different rules.
  #
  # A source item still exists but no longer asserts a fact (Kestrel drops out of
  # integrations.md): that is a decision, visible in a diff, and the fact is removed in the
  # same run. No grace, because there is nothing ambiguous about it.
  #
  # A source item is gone entirely (docs/security.md is deleted, or a fetch failed and
  # returned nothing): that could be a deletion or an outage, and they look identical for one
  # run. Wait for grace_runs consecutive absences before removing.
  grace_runs: 2
  # If one run would remove more than this share of active facts, publish is held for a human.
  # A source returning nothing at all is the usual cause, and it should never silently empty
  # the company's own description of itself.
  anomaly_threshold: 0.25
  # Email is append-only in the world: a message that is not in this run's window has not
  # been retracted. Only a later, higher-precedence statement supersedes an email fact.
  never_absence_remove: [email]

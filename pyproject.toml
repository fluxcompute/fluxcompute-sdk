[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxcompute"
version = "0.3.1"
description = "Route every query to the cheapest model that can answer it — an optimization layer for agentic workflows."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Ishan Patwardhan", email = "hello@fluxcompute.dev"}
]
keywords = ["llm", "inference", "routing", "agentic", "optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Upper bound is load-bearing: anthropic 1.0.0 removed `temperature` from
    # AsyncMessages.create() and the signature has no **kwargs to absorb it,
    # so dispatch_anthropic's call raises TypeError on every real request.
    # Nothing in CI catches this since tests patch the dispatchers -- only a
    # real install against a real provider surfaces it. Same fix already
    # applied server-side in fluxcompute-observability#14; ported here since
    # this dependency spec is independent and never got the same pin. Adopting
    # anthropic 1.x is a deliberate migration (audit every create() kwarg
    # first), not a version-bump side effect.
    "anthropic>=0.30.0,<1.0.0",
    # Same class of risk; 2.x is what's currently tested.
    "openai>=1.30.0,<3.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    # Upper bound is load-bearing: ruff enables new rules in minor releases, so
    # an unbounded spec makes CI's lint result depend on ruff's release date
    # rather than on this repo's code. 0.16 turns on UP006/UP035/UP045/B008/I001
    # by default, which flags ~500 pre-existing style choices across the tree
    # (Optional[X], Dict[...], Depends() defaults) and fails CI on untouched
    # commits. Adopting that style is a deliberate, separate migration.
    "ruff>=0.4.0,<0.15",
    "langgraph>=0.2.0",
    # examples/agents/company_brain reads YAML; listed here too so tests/ can import the agents.
    "pyyaml>=6.0",
]
# What the worked agents under examples/agents/ need beyond the SDK itself.
examples = ["pyyaml>=6.0"]

[project.urls]
Homepage = "https://fluxcompute.dev"
Repository = "https://github.com/fluxcompute/fluxcompute-sdk"
Changelog = "https://github.com/fluxcompute/fluxcompute-sdk/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["fluxcompute*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint.per-file-ignores]
# The notebooks' first cell does `import os, getpass` on one line, as a notebook would.
"*.ipynb" = ["E401"]
